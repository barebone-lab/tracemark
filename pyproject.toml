[project]
name = "tracemark"
version = "0.1.1"
description = "Trace a leaked copy of text or an image back to the person it was issued to"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["watermark", "leak tracing", "fingerprinting", "steganography"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "cryptography>=42",
    "reedsolo>=1.7,<2",
    "opencv-python-headless>=5.0.0.93",
]

[project.urls]
Homepage = "https://github.com/barebone-lab/tracemark"
Documentation = "https://github.com/barebone-lab/tracemark#readme"
Source = "https://github.com/barebone-lab/tracemark"

[project.optional-dependencies]
generative = [
    "mlx-lm>=0.31.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracemark", "tracemark.data"]

[tool.setuptools.package-data]
"tracemark.data" = ["*.json"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
